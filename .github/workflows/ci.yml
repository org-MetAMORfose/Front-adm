name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/front_adm_ci
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:unit

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metaamorfose-front-adm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name metaamorfose-front-adm-ci \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://user:password@127.0.0.1:5432/front_adm_ci \
            -e SEND_MESSAGE_URL=http://127.0.0.1:8000/send \
            -e UPLOAD_MEDIA_URL=http://127.0.0.1:8000/upload-media \
            -e APPROVE_PROFESSIONAL_URL=http://127.0.0.1:8000/approve \
            -e MATCHING_LAMBDA_NAME=matching \
            -e CHATBOT_CREATE_PROFESSIONAL_URL=http://127.0.0.1:8000/professionals \
            -e MATCHING_FOLLOWUP_TEMPLATE_URL=http://127.0.0.1:8000/whatsapp/templates/acompanhamento_emparelhamento \
            -e S3_BUCKET_NAME=front-adm-ci \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_REGION=us-east-1 \
            metaamorfose-front-adm:ci

      - name: Wait for the admin page
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/admin/ > /dev/null; then
              exit 0
            fi
            echo "Waiting for container (attempt $attempt/30)"
            sleep 2
          done

          echo "Container smoke test failed"
          docker logs metaamorfose-front-adm-ci
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker logs metaamorfose-front-adm-ci || true

      - name: Shutdown
        if: always()
        run: docker rm -f metaamorfose-front-adm-ci || true
