name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: front-adm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: metaamorfose-front-adm:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment archive
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git archive --format=tar.gz --output=front-adm-deploy.tar.gz HEAD
          docker save "metaamorfose-front-adm:$DEPLOY_SHA" | gzip -1 > front-adm-image.tar.gz

      - name: Copy tested release to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: front-adm-deploy.tar.gz,front-adm-image.tar.gz
          target: /tmp/front-adm-${{ github.run_id }}
          rm: true
          command_timeout: 15m

      - name: Deploy tested commit over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_ARCHIVE_PATH: /tmp/front-adm-${{ github.run_id }}/front-adm-deploy.tar.gz
          DEPLOY_IMAGE_PATH: /tmp/front-adm-${{ github.run_id }}/front-adm-image.tar.gz
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEND_MESSAGE_URL: ${{ secrets.SEND_MESSAGE_URL }}
          UPLOAD_MEDIA_URL: ${{ secrets.UPLOAD_MEDIA_URL }}
          APPROVE_PROFESSIONAL_URL: ${{ secrets.APPROVE_PROFESSIONAL_URL }}
          MATCHING_LAMBDA_NAME: ${{ vars.MATCHING_LAMBDA_NAME || 'matching' }}
          CHATBOT_CREATE_PROFESSIONAL_URL: ${{ secrets.CHATBOT_CREATE_PROFESSIONAL_URL }}
          MATCHING_FOLLOWUP_TEMPLATE_URL: ${{ secrets.MATCHING_FOLLOWUP_TEMPLATE_URL }}
          CHATBOT_FLOW_API_URL: ${{ secrets.CHATBOT_FLOW_API_URL }}
          CHATBOT_FAQ_API_URL: ${{ secrets.CHATBOT_FAQ_API_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CHATBOT_DOCKER_NETWORK: ${{ secrets.CHATBOT_DOCKER_NETWORK }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DEPLOY_SHA,DEPLOY_ARCHIVE_PATH,DEPLOY_IMAGE_PATH,DATABASE_URL,SEND_MESSAGE_URL,UPLOAD_MEDIA_URL,APPROVE_PROFESSIONAL_URL,MATCHING_LAMBDA_NAME,CHATBOT_CREATE_PROFESSIONAL_URL,MATCHING_FOLLOWUP_TEMPLATE_URL,S3_BUCKET_NAME,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,CHATBOT_DOCKER_NETWORK
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu

            : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
            : "${DEPLOY_ARCHIVE_PATH:?DEPLOY_ARCHIVE_PATH is required}"
            : "${DEPLOY_IMAGE_PATH:?DEPLOY_IMAGE_PATH is required}"

            FRONT_ADM_ROOT="$HOME/front-adm"
            RELEASE_DIR="$FRONT_ADM_ROOT/releases/$DEPLOY_SHA"

            mkdir -p "$RELEASE_DIR"
            tar -xzf "$DEPLOY_ARCHIVE_PATH" -C "$RELEASE_DIR"
            rm -f "$DEPLOY_ARCHIVE_PATH"

            echo "Memory before loading the deployment image:"
            free -h

            docker load --input "$DEPLOY_IMAGE_PATH"
            rm -f "$DEPLOY_IMAGE_PATH"
            docker image inspect "metaamorfose-front-adm:$DEPLOY_SHA" > /dev/null

            cd "$RELEASE_DIR"

            test -f Dockerfile
            test -f docker-compose.yml

            : "${DATABASE_URL:?GitHub Secret DATABASE_URL is required}"
            : "${SEND_MESSAGE_URL:?GitHub Secret SEND_MESSAGE_URL is required}"
            : "${UPLOAD_MEDIA_URL:?GitHub Secret UPLOAD_MEDIA_URL is required}"
            : "${CHATBOT_FLOW_API_URL:?GitHub Secret CHATBOT_FLOW_API_URL is required}"
            : "${CHATBOT_FAQ_API_URL:?GitHub Secret CHATBOT_FAQ_API_URL is required}"
            : "${S3_BUCKET_NAME:?GitHub Secret S3_BUCKET_NAME is required}"
            : "${AWS_ACCESS_KEY_ID:?GitHub Secret AWS_ACCESS_KEY_ID is required}"
            : "${AWS_SECRET_ACCESS_KEY:?GitHub Secret AWS_SECRET_ACCESS_KEY is required}"
            : "${AWS_REGION:?GitHub Secret AWS_REGION is required}"
            : "${MATCHING_LAMBDA_NAME:?GitHub Secret MATCHING_LAMBDA_NAME is required}"
            : "${CHATBOT_DOCKER_NETWORK:?GitHub Secret CHATBOT_DOCKER_NETWORK is required}"

            umask 077
            {
              printf '%s\n' "DATABASE_URL=$DATABASE_URL"
              printf '%s\n' "SEND_MESSAGE_URL=$SEND_MESSAGE_URL"
              printf '%s\n' "UPLOAD_MEDIA_URL=$UPLOAD_MEDIA_URL"
              printf '%s\n' "APPROVE_PROFESSIONAL_URL=${APPROVE_PROFESSIONAL_URL:-}"
              printf '%s\n' "MATCHING_LAMBDA_NAME=$MATCHING_LAMBDA_NAME"
              printf '%s\n' "CHATBOT_CREATE_PROFESSIONAL_URL=${CHATBOT_CREATE_PROFESSIONAL_URL:-}"
              printf '%s\n' "MATCHING_FOLLOWUP_TEMPLATE_URL=${MATCHING_FOLLOWUP_TEMPLATE_URL:-}"
              printf '%s\n' "CHATBOT_FLOW_API_URL=$CHATBOT_FLOW_API_URL"
              printf '%s\n' "CHATBOT_FAQ_API_URL=$CHATBOT_FAQ_API_URL"
              printf '%s\n' "S3_BUCKET_NAME=$S3_BUCKET_NAME"
              printf '%s\n' "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
              printf '%s\n' "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
              printf '%s\n' "AWS_REGION=$AWS_REGION"
              printf '%s\n' "CHATBOT_DOCKER_NETWORK=$CHATBOT_DOCKER_NETWORK"
            } > .env.deploy
            mv .env.deploy .env
            chmod 600 .env

            export FRONT_ADM_IMAGE_TAG="$DEPLOY_SHA"

            docker compose --project-name front-adm config --quiet
            docker compose --project-name front-adm up -d --no-build --remove-orphans

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/admin/api/health; then
                echo "Front admin deployed successfully"
                ln -sfn "$RELEASE_DIR" "$FRONT_ADM_ROOT/current"
                docker compose --project-name front-adm ps
                echo "Memory after deployment:"
                free -h
                exit 0
              fi
              echo "Waiting for health check (attempt $attempt/30)"
              sleep 2
            done

            echo "Front admin health check failed"
            docker compose --project-name front-adm ps
            docker compose --project-name front-adm logs --tail=200 front-adm
            exit 1
