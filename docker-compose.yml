services:
  front-adm:
    image: metaamorfose-front-adm:${FRONT_ADM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: metaamorfose-front-adm
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/admin/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  chatbot:
    external: true
    name: ${CHATBOT_DOCKER_NETWORK}
